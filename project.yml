name: AnubisMCP
options:
  bundleIdPrefix: site.neuralnexus
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  FlyingFox:
    url: https://github.com/swhitty/FlyingFox
    from: "0.20.0"

targets:
  AnubisMCP:
    type: application
    platform: iOS
    sources:
      - AnubisMCP
    dependencies:
      - package: FlyingFox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: site.neuralnexus.anubis-mcp
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AnubisMCP/Info.plist
        CODE_SIGN_ENTITLEMENTS: AnubisMCP/AnubisMCP.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
